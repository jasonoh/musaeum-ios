name: Musaeum
options:
  bundleIdPrefix: dev.jasonoh
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.0

targets:
  Musaeum:
    type: application
    platform: iOS
    sources:
      - path: Musaeum
        excludes:
          - Info.plist
    info:
      path: Musaeum/Info.plist
      properties:
        CFBundleDisplayName: Musaeum
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The server binds the tailnet address and speaks cleartext http inside
        # WireGuard; there is no TLS story in this app (the workstream's D3).
        # ATS has no exception that covers a 100.64/10 address, so cleartext is
        # allowed outright rather than pretended about.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator

  MusaeumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MusaeumTests
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        # A unit-test bundle carries no plist of its own; without this the
        # generated project refuses to code sign it.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Musaeum

schemes:
  Musaeum:
    build:
      targets:
        Musaeum: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusaeumTests

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
