name: Musaeum
options:
  bundleIdPrefix: dev.jasonoh
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.0

targets:
  Musaeum:
    type: application
    platform: iOS
    sources:
      - path: Musaeum
        excludes:
          - Info.plist
    info:
      path: Musaeum/Info.plist
      properties:
        CFBundleDisplayName: Musaeum
        UILaunchScreen: {}
        # **The window and the launch screen are dark from the first frame.**
        # The app's own look is dark, and it forces it in SwiftUI
        # (`.preferredColorScheme(.dark)` in `MusaeumApp`) — but that is applied
        # when SwiftUI paints, so without this property a cold launch shows a
        # **white** launch screen and a white window backdrop, then flips. Found
        # by the owner running the app from Xcode (a debugger-attached launch
        # leaves the white on screen long enough to look like a hung app) and
        # reproduced here: a cold-launch frame with the Connect screen laid out
        # white-on-white.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The server binds the tailnet address and speaks cleartext http inside
        # WireGuard; there is no TLS story in this app (the workstream's D3).
        # ATS has no exception that covers a 100.64/10 address, so cleartext is
        # allowed outright rather than pretended about.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # **“Copy to Musaeum” — the share sheet without an extension, and without
        # a capability.** Files, Safari and Mail offer a share target for any app
        # that declares the type; declaring the four the contract accepts is what
        # puts Musaeum in that list, and `LSSupportsOpeningDocumentsInPlace` false
        # is what makes iOS **copy** the file into this app's own `Documents/Inbox`
        # and open the app rather than hand over a security-scoped original. The
        # app then sends it through `UploadModel.send` — the same door the picker
        # uses.
        #
        # **The alternative was a share extension, and it was measured against the
        # owner's signing first:** an extension is a second target, and getting the
        # file across to the app needs either an app-group container or a keychain
        # access group. Both are Apple Developer Program capabilities, so with the
        # free personal team this app is signed with today (`DEVELOPMENT_TEAM`
        # below), adding either stops the profile being issued and **the app itself
        # — not just the extension — stops installing on the iPhone**. The simulator
        # ignores provisioning, so the whole gate suite would have stayed green
        # while the phone could no longer run it. This route needs no entitlement,
        # keeps the token in one process, and is what the annex's 4b landed as.
        #
        # The two Kindle formats have no system type, so the app declares them —
        # without a declaration, a `.mobi` is an anonymous `dyn.…` type and no share
        # target matches it.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
              - com.amazon.mobi
              - com.amazon.azw3
              - com.adobe.pdf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.amazon.mobi
            UTTypeDescription: Mobipocket book
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobi]
          - UTTypeIdentifier: com.amazon.azw3
            UTTypeDescription: Kindle book
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
    settings:
      base:
        # **The owner's personal team, so the app can run on the phone.**
        # Without a `DEVELOPMENT_TEAM` the generated project signs with
        # `CODE_SIGN_IDENTITY = iPhone Developer` and no team, and a device build
        # stops at *"Signing for Musaeum requires a development team"* — which is
        # exactly where a run on the iPhone ends until someone picks a team in
        # Xcode's Signing pane by hand. `project.yml` is the source of truth for
        # build settings (invariant 9), so the team lives here and the simulator
        # builds are untouched by it.
        #
        # A **free** personal team is enough for this app: it declares no
        # entitlements (no app groups, no push, no associated domains), so there is
        # no capability the free tier refuses. What it costs is that the profile
        # expires after **7 days** — the app then refuses to launch and has to be
        # re-run once from Xcode to renew it.
        DEVELOPMENT_TEAM: 6WZJ9793G7
        CODE_SIGN_STYLE: Automatic
        # **The app icon is the desktop app's own artwork** — the owner's call, so
        # the two clients read as one product on the home screen. The master
        # (`musaeum`'s `build/icon.png`) is a *macOS* icon: a squircle inset about
        # 4% inside a transparent canvas, with a soft rim, which iOS would then
        # round a second time. `Musaeum/Resources/Assets.xcassets`'s
        # `AppIcon-1024.png` is that artwork cropped to its own bounds, its rim
        # trimmed, the corners filled with the field's own top-to-bottom
        # gradient, flattened to RGB and scaled to 1024² — which lands its radius
        # (≈22.4% of the side, the fraction both platforms mask at) on iOS's own
        # mask radius. So the corners the fill invents are the corners iOS cuts
        # away, and what the home screen shows is the master's composition.
        #
        # No dark or tinted appearance is declared: one icon serves all three
        # (iOS 18 tints it itself), and a second set is artwork this workstream
        # would have to keep in step with the Mac's by hand.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator

  MusaeumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MusaeumTests
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        # A unit-test bundle carries no plist of its own; without this the
        # generated project refuses to code sign it.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Musaeum

schemes:
  Musaeum:
    build:
      targets:
        Musaeum: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusaeumTests

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
